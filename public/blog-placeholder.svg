<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2e18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Pattern overlay -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="2" fill="#16a43b" opacity="0.1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#dots)" />
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="60" fill="none" stroke="#16a43b" stroke-width="2" opacity="0.3"/>
  <circle cx="700" cy="370" r="80" fill="none" stroke="#16a43b" stroke-width="2" opacity="0.3"/>
  
  <!-- Text -->
  <text x="50%" y="50%" text-anchor="middle" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="48" fill="#16a43b" opacity="0.2">Blog</text>
</svg>
